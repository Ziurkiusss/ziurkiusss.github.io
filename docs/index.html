<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0d1117;
    color: white;
}

nav {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(0,0,0,0.7);
    padding: 15px;
    display: flex;
    justify-content: center;
    gap: 20px;
    backdrop-filter: blur(10px);
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

section {
    padding: 100px 40px 40px;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: #161b22;
    border-radius: 12px;
    overflow: hidden;
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.card p {
    padding: 10px;
    text-align: center;
}
</style>
</head>

<body>

<nav>
    <a href="#configs">Configs</a>
    <a href="#graphics">Graphics</a>
</nav>

<section id="configs">
    <h2>Configurations</h2>
    <div class="grid">

        <div class="card">
            <img src="photos/configs/config1.png">
            <p>Config 1</p>
        </div>

        <div class="card">
            <img src="photos/configs/config2.png">
            <p>Config 2</p>
        </div>

    </div>
</section>

<section id="graphics">
    <h2>Graphic Design</h2>
    <div class="grid">

        <div class="card">
            <img src="photos/graphics/design1.png">
            <p>Design 1</p>
        </div>

        <div class="card">
            <img src="photos/graphics/design2.png">
            <p>Design 2</p>
        </div>

    </div>
</section>

</body>
</html>
