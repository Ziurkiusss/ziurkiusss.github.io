<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family:Inter, sans-serif;
    background:#0d1117;
    color:white;
}

nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.6);
    padding:10px;
    border-radius:999px;
    display:flex;
    gap:10px;
    backdrop-filter:blur(10px);
}

nav a{
    color:white;
    text-decoration:none;
    padding:8px 16px;
    border-radius:999px;
}

nav a:hover{
    background:#58a6ff;
}

.hero{
    height:70vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero h1{
    font-size:60px;
}

section{
    padding:80px 40px;
}

h2{
    text-align:center;
    margin-bottom:30px;
    font-size:32px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#161b22;
    border-radius:12px;
    overflow:hidden;
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card-content{
    padding:10px;
    text-align:center;
}
</style>
</head>

<body>

<nav>
    <a href="#configs">Configs</a>
    <a href="#graphics">Graphics</a>
</nav>

<div class="hero">
    <h1>Portfolio</h1>
</div>

<section id="configs">
    <h2>Configurations</h2>
    <div class="gallery" id="configsGallery"></div>
</section>

<section id="graphics">
    <h2>Graphic Design</h2>
    <div class="gallery" id="graphicsGallery"></div>
</section>

<script>
/*
JUST ADD FILE PATHS HERE.
NO JSON. NO FETCH. NO ERRORS.
*/

const configs = [
  "photos/configs/config1.png",
  "photos/configs/config2.png",
  "photos/configs/config3.png"
];

const graphics = [
  "photos/graphics/design1.png",
  "photos/graphics/design2.png",
  "photos/graphics/design3.png"
];

function render(list, id){
    const container = document.getElementById(id);

    list.forEach(src => {
        container.innerHTML += `
            <div class="card">
                <img src="${src}">
                <div class="card-content"></div>
            </div>
        `;
    });
}

render(configs, "configsGallery");
render(graphics, "graphicsGallery");
</script>

</body>
</html>
