<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        nav {
            position: sticky;
            top: 0;
            background: #1a1a1a;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 30px;
            border-bottom: 1px solid #333;
            z-index: 1000;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #4da6ff;
        }

        section {
            padding: 60px 40px;
        }

        h2 {
            margin-bottom: 25px;
            text-align: center;
            font-size: 2rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .item {
            background: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .item p {
            padding: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#configs">Configurations</a>
        <a href="#graphics">Graphic Design</a>
    </nav>

    <section id="configs">
        <h2>Configurations</h2>

        <div class="gallery">

            <!-- Config images fetched from photos/configs folder -->

            <div class="item">
                <img src="photos/configs/config1.png" alt="Config 1">
                <p>Config Name</p>
            </div>

            <div class="item">
                <img src="photos/configs/config2.png" alt="Config 2">
                <p>Config Name</p>
            </div>

            <div class="item">
                <img src="photos/configs/config3.png" alt="Config 3">
                <p>Config Name</p>
            </div>

        </div>
    </section>

    <section id="graphics">
        <h2>Graphic Design</h2>

        <div class="gallery">

            <!-- Graphic images fetched from photos/graphics folder -->

            <div class="item">
                <img src="photos/graphics/design1.png" alt="Design 1">
                <p>Design Name</p>
            </div>

            <div class="item">
                <img src="photos/graphics/design2.png" alt="Design 2">
                <p>Design Name</p>
            </div>

            <div class="item">
                <img src="photos/graphics/design3.png" alt="Design 3">
                <p>Design Name</p>
            </div>

        </div>
    </section>

</body>
</html>
