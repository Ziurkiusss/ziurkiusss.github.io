<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

:root{
    --bg:#0d1117;
    --card:#161b22;
    --border:#30363d;
    --accent:#58a6ff;
    --text:#f0f6fc;
    --secondary:#8b949e;
}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* NAV */
nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;

    display:flex;
    gap:10px;

    padding:10px;
    border:1px solid rgba(255,255,255,0.1);
    background:rgba(22,27,34,.75);
    backdrop-filter:blur(15px);
    border-radius:999px;
}

nav a{
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border-radius:999px;
    transition:.25s;
    font-weight:600;
}

nav a:hover{
    background:var(--accent);
}

/* HERO */
.hero{
    min-height:70vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:0 20px;
}

.hero h1{
    font-size:clamp(3rem,8vw,6rem);
}

.hero p{
    color:var(--secondary);
    margin-top:10px;
}

/* SECTIONS */
section{
    padding:80px 8%;
}

.section-title{
    font-size:2.5rem;
    margin-bottom:40px;
    text-align:center;
}

/* GRID */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
}

/* CARD */
.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
    border-color:var(--accent);
}

.card img{
    width:100%;
    height:230px;
    object-fit:cover;
}

.card-content{
    padding:18px;
}

.card-content h3{
    margin-bottom:6px;
}

.card-content p{
    color:var(--secondary);
}

/* FOOTER */
footer{
    text-align:center;
    padding:40px;
    color:var(--secondary);
    border-top:1px solid var(--border);
}
</style>
</head>

<body>

<nav>
    <a href="#configs">Configurations</a>
    <a href="#graphics">Graphic Design</a>
</nav>

<div class="hero">
    <h1>Portfolio</h1>
    <p>Minecraft configs & graphic designs</p>
</div>

<!-- CONFIGS -->
<section id="configs">
    <h2 class="section-title">Configurations</h2>

    <div class="gallery">

        <!-- PASTE RAW IMAGE LINKS HERE -->
        <div class="card">
            <img src="https://github.com/Ziurkiusss/ziurkiusss.github.io/blob/main/photos/configs/config1.png?raw=true">
            <div class="card-content">
                <h3>Config Name</h3>
                <p>Description</p>
            </div>
        </div>

        <div class="card">
            <img src="PASTE_RAW_LINK_HERE">
            <div class="card-content">
                <h3>Config Name</h3>
                <p>Description</p>
            </div>
        </div>

        <div class="card">
            <img src="PASTE_RAW_LINK_HERE">
            <div class="card-content">
                <h3>Config Name</h3>
                <p>Description</p>
            </div>
        </div>

    </div>
</section>

<!-- GRAPHICS -->
<section id="graphics">
    <h2 class="section-title">Graphic Design</h2>

    <div class="gallery">

        <!-- PASTE RAW IMAGE LINKS HERE -->
        <div class="card">
            <img src="PASTE_RAW_LINK_HERE">
            <div class="card-content">
                <h3>Design Name</h3>
                <p>Description</p>
            </div>
        </div>

        <div class="card">
            <img src="PASTE_RAW_LINK_HERE">
            <div class="card-content">
                <h3>Design Name</h3>
                <p>Description</p>
            </div>
        </div>

    </div>
</section>

<footer>
    © 2026 Portfolio
</footer>

</body>
</html>
