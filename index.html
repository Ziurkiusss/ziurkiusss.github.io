<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

:root{
    --bg:#0d1117;
    --card:#161b22;
    --border:#30363d;
    --accent:#58a6ff;
    --text:#f0f6fc;
    --secondary:#8b949e;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Inter, sans-serif;
}

/* NAV */
nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;
    display:flex;
    gap:10px;
    padding:10px 14px;
    border-radius:999px;
    background:rgba(22,27,34,.75);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1);
}

nav a{
    color:white;
    text-decoration:none;
    padding:10px 16px;
    border-radius:999px;
    font-weight:600;
}

nav a:hover{
    background:var(--accent);
}

/* CONTACT */
.contact-btn{
    position:fixed;
    top:20px;
    right:20px;
    z-index:1000;
    padding:10px 18px;
    border-radius:12px;
    background:var(--accent);
    color:white;
    text-decoration:none;
    font-weight:700;
}

/* HERO */
.hero{
    min-height:80vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:0 20px;
}

.hero h1{
    font-family:'Press Start 2P', cursive;
    font-size:2.8rem;
}

.hero p{
    margin-top:15px;
    color:var(--secondary);
    max-width:700px;
}

/* SECTION */
section{
    padding:70px 8% 90px 8%;
}

.section-title{
    font-family:'Press Start 2P', cursive;
    font-size:2.2rem;
    text-align:center;
    margin-bottom:50px;
}

/* GRID */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill, 440px);
    justify-content:center;
    gap:25px;
}

/* CARD */
.card{
    width:440px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    cursor:pointer;
    transition:.25s;
    display:flex;
    flex-direction:column;
}

.card:hover{
    transform:scale(1.03);
    border-color:var(--accent);
}

/* IMAGE */
.card img{
    width:100%;
    height:300px;
    object-fit:cover;
}

/* TITLE */
.card-content{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Press Start 2P';
    font-size:12px;
}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.92);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:2000;
}

.modal.show{
    display:flex;
}

.modal img{
    max-width:90%;
    max-height:80%;
    border-radius:12px;
    border:2px solid var(--accent);
}

/* ARROWS */
.nav-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:60px;
    height:60px;
    border-radius:50%;
    background:rgba(88,166,255,0.15);
    border:1px solid var(--accent);
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
}

.nav-left{ left:30px; }
.nav-right{ right:30px; }

.nav-arrow span{
    font-size:30px;
    font-weight:900;
}
</style>
</head>

<body>

<nav>
    <a href="#configs">Configs</a>
    <a href="#graphics">Designs</a>
</nav>

<a class="contact-btn" href="https://discord.com/users/YOUR_ID">Contact</a>

<div class="hero">
    <h1>MINECRAFT PORTFOLIO</h1>
    <p>Configs and graphic designs.</p>
</div>

<section id="configs">
<h2 class="section-title">CONFIGURATIONS</h2>

<div class="gallery">

    <div class="card" onclick="openGallery(0)">
        <img id="thumb0">
        <div class="card-content">CONFIG 1</div>
    </div>

    <div class="card" onclick="openGallery(1)">
        <img id="thumb1">
        <div class="card-content">CONFIG 2</div>
    </div>

</div>
</section>

<section id="graphics">
<h2 class="section-title">GRAPHIC DESIGN</h2>

<div class="gallery">

    <div class="card" onclick="openGallery(2)">
        <img id="thumb2">
        <div class="card-content">DESIGN 1</div>
    </div>

</div>
</section>

<!-- MODAL -->
<div class="modal" id="modal" onclick="closeModal()">
    <img id="modalImg">
</div>

<script>
const projects = [
{
    images:[
        "https://raw.githubusercontent.com/Ziurkiusss/ziurkiusss.github.io/main/photos/configs/config1.png",
        "https://raw.githubusercontent.com/Ziurkiusss/ziurkiusss.github.io/main/photos/configs/config2.png"
    ]
},
{
    images:[
        "https://raw.githubusercontent.com/Ziurkiusss/ziurkiusss.github.io/main/photos/configs/config2.png"
    ]
},
{
    images:[
        "https://raw.githubusercontent.com/Ziurkiusss/ziurkiusss.github.io/main/photos/graphics/design1.png"
    ]
}
];

// thumbnails = FIRST image of each project
document.getElementById("thumb0").src = projects[0].images[0];
document.getElementById("thumb1").src = projects[1].images[0];
document.getElementById("thumb2").src = projects[2].images[0];

let current = 0;
let index = 0;

function openGallery(i){
    current = i;
    index = 0;
    document.getElementById("modalImg").src = projects[current].images[index];
    document.getElementById("modal").classList.add("show");

    modalClickFix();
}

function nextImg(){
    index = (index + 1) % projects[current].images.length;
    document.getElementById("modalImg").src = projects[current].images[index];
}

function prevImg(){
    index = (index - 1 + projects[current].images.length) % projects[current].images.length;
    document.getElementById("modalImg").src = projects[current].images[index];
}

function closeModal(){
    document.getElementById("modal").classList.remove("show");
}

// click outside closes
function modalClickFix(){
    document.getElementById("modal").onclick = closeModal;
}
</script>

</body>
</html>
