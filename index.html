<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolioo</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

:root{
    --bg:#0d1117;
    --card:#161b22;
    --border:#30363d;
    --accent:#58a6ff;
    --text:#f0f6fc;
    --secondary:#8b949e;
}

body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* NAV */
nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;

    display:flex;
    gap:10px;

    padding:10px;
    border:1px solid rgba(255,255,255,0.1);

    background:rgba(22,27,34,.75);
    backdrop-filter:blur(15px);

    border-radius:999px;
}

nav a{
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border-radius:999px;
    transition:.25s;
    font-weight:600;
}

nav a:hover{
    background:var(--accent);
    color:#fff;
}

/* HERO */
.hero{
    min-height:70vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:0 20px;
}

.hero h1{
    font-size:clamp(3rem,8vw,6rem);
    margin-bottom:15px;
}

.hero p{
    color:var(--secondary);
    font-size:1.2rem;
    max-width:700px;
}

.hero .button{
    margin-top:30px;
    text-decoration:none;
    color:white;
    background:var(--accent);
    padding:14px 24px;
    border-radius:12px;
    font-weight:600;
    transition:.3s;
}

.hero .button:hover{
    transform:translateY(-3px);
}

/* SECTIONS */
section{
    padding:80px 8%;
}

.section-title{
    font-size:2.5rem;
    margin-bottom:40px;
    text-align:center;
}

/* GALLERY */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
    border-color:var(--accent);
    box-shadow:0 15px 40px rgba(88,166,255,.15);
}

.card img{
    width:100%;
    height:230px;
    object-fit:cover;
    display:block;
}

.card-content{
    padding:18px;
}

.card-content h3{
    margin-bottom:8px;
}

.card-content p{
    color:var(--secondary);
    font-size:.95rem;
}

/* FOOTER */
footer{
    text-align:center;
    padding:40px;
    color:var(--secondary);
    border-top:1px solid var(--border);
}
</style>
</head>

<body>

<nav>
    <a href="#configs">Configurations</a>
    <a href="#graphics">Graphic Design</a>
</nav>

<div class="hero">
    <h1>Portfolio</h1>
    <p>
        Minecraft configurations, server setups, custom menus,
        graphics, branding, thumbnails, and more.
    </p>

    <a href="#configs" class="button">View Projects</a>
</div>

<section id="configs">
    <h2 class="section-title">Configurations</h2>
    <div class="gallery" id="configsGallery"></div>
</section>

<section id="graphics">
    <h2 class="section-title">Graphic Design</h2>
    <div class="gallery" id="graphicsGallery"></div>
</section>

<footer>
    © 2026 Your Portfolio
</footer>

<script>
async function loadGallery() {
    const res = await fetch("./data.json");
    const data = await res.json();

    const configs = document.getElementById("configsGallery");
    const graphics = document.getElementById("graphicsGallery");

    data.configs.forEach(item => {
        configs.innerHTML += `
        <div class="card">
            <img src="${item.file}">
            <div class="card-content">
                <h3>${item.title}</h3>
                <p>${item.desc}</p>
            </div>
        </div>`;
    });

    data.graphics.forEach(item => {
        graphics.innerHTML += `
        <div class="card">
            <img src="${item.file}">
            <div class="card-content">
                <h3>${item.title}</h3>
                <p>${item.desc}</p>
            </div>
        </div>`;
    });
}

loadGallery();
</script>

</body>
</html>
