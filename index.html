<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

:root{
    --bg:#0d1117;
    --card:#161b22;
    --border:#30363d;
    --accent:#58a6ff;
    --text:#f0f6fc;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Inter, sans-serif;
}

/* NAV */
nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;
    display:flex;
    gap:10px;
    padding:10px 14px;
    border-radius:999px;
    background:rgba(22,27,34,.75);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1);
}

nav a{
    color:white;
    text-decoration:none;
    padding:10px 16px;
    border-radius:999px;
    font-weight:600;
}

nav a:hover{ background:var(--accent); }

/* CONTACT */
.contact-btn{
    position:fixed;
    top:20px;
    right:20px;
    z-index:1000;
    padding:10px 18px;
    border-radius:12px;
    background:var(--accent);
    color:white;
    text-decoration:none;
    font-weight:700;
}

/* HERO */
.hero{
    min-height:70vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero h1{
    font-family:'Press Start 2P', cursive;
    font-size:2.6rem;
}

.hero p{
    margin-top:15px;
    color:var(--secondary);
}

/* TITLES */
.section-title{
    font-family:'Press Start 2P', cursive;
    font-size:2.2rem;
    text-align:center;
    margin-bottom:55px;
}

/* SECTIONS */
section{
    padding:100px 8%;
}

/* GRID */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill, 440px);
    justify-content:center;
    gap:30px;
}

/* CARD */
.card{
    width:440px;
    height:500px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    cursor:pointer;
    transition:.25s;
}

.card:hover{
    transform:scale(1.03);
    border-color:var(--accent);
}

/* IMAGE */
.card img{
    width:100%;
    height:350px;
    object-fit:cover;
}

/* ONLY TITLE + TINY SPACE */
.card-content{
    padding:8px 12px 10px 12px;
    text-align:center;
}

.card-content h3{
    font-family:'Press Start 2P', cursive;
    font-size:1rem;
    margin:0;
}

/* SMALL GAP UNDER TITLE (VERY MINIMAL) */
.title-gap{
    height:4px;
}

/* MODAL */
.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.92);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:2000;
}

.modal.show{ display:flex; }

.modal img{
    max-width:90%;
    max-height:80%;
    border-radius:12px;
    border:2px solid var(--accent);
}

/* ARROWS */
.nav-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:60px;
    height:60px;
    border-radius:50%;
    background:rgba(88,166,255,0.15);
    border:1px solid var(--accent);
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
}

.nav-arrow:hover{
    background:rgba(88,166,255,0.35);
}

.nav-arrow span{
    font-size:30px;
    font-weight:900;
    color:var(--text);
}

.nav-left{ left:30px; }
.nav-right{ right:30px; }

/* CLOSE */
.close{
    position:absolute;
    top:20px;
    right:30px;
    font-size:30px;
    cursor:pointer;
    color:white;
}

/* FOOTER */
footer{
    text-align:center;
    padding:40px;
    color:var(--secondary);
    border-top:1px solid var(--border);
    margin-top:80px;
}
</style>
</head>

<body>

<nav>
    <a href="#configs">Configs</a>
    <a href="#graphics">Designs</a>
</nav>

<a class="contact-btn" href="https://discord.com/users/YOUR_ID" target="_blank">
Contact Me
</a>

<div class="hero">
    <h1>MINECRAFT PORTFOLIO</h1>
    <p>Configs, PvP setups, FPS optimizations & designs.</p>
</div>

<section id="configs">
<h2 class="section-title">CONFIGURATIONS</h2>

<div class="gallery">

    <div class="card" onclick="openGallery(0)">
        <img src="img1.png">
        <div class="card-content">
            <h3>CONFIG 1</h3>
            <div class="title-gap"></div>
        </div>
    </div>

    <div class="card" onclick="openGallery(1)">
        <img src="img4.png">
        <div class="card-content">
            <h3>CONFIG 2</h3>
            <div class="title-gap"></div>
        </div>
    </div>

</div>
</section>

<section id="graphics">
<h2 class="section-title">GRAPHIC DESIGN</h2>

<div class="gallery">

    <div class="card" onclick="openGallery(2)">
        <img src="img6.png">
        <div class="card-content">
            <h3>DESIGN 1</h3>
            <div class="title-gap"></div>
        </div>
    </div>

</div>
</section>

<footer>
© 2026 Portfolio
</footer>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="close" onclick="closeModal()">×</div>

    <div class="nav-arrow nav-left" onclick="prevImg()">
        <span>‹</span>
    </div>

    <img id="modalImg">

    <div class="nav-arrow nav-right" onclick="nextImg()">
        <span>›</span>
    </div>
</div>

<script>
const projects = [
{
    images:["img1.png","img2.png","img3.png"]
},
{
    images:["img4.png","img5.png"]
},
{
    images:["img6.png","img7.png"]
}
];

let current = 0;
let index = 0;

function openGallery(i){
    current = i;
    index = 0;
    document.getElementById("modalImg").src = projects[current].images[index];
    document.getElementById("modal").classList.add("show");
}

function nextImg(){
    index = (index + 1) % projects[current].images.length;
    document.getElementById("modalImg").src = projects[current].images[index];
}

function prevImg(){
    index = (index - 1 + projects[current].images.length) % projects[current].images.length;
    document.getElementById("modalImg").src = projects[current].images[index];
}

function closeModal(){
    document.getElementById("modal").classList.remove("show");
}
</script>

</body>
</html>
