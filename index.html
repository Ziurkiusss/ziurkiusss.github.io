<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

:root{
    --bg:#0d1117;
    --card:#161b22;
    --border:#30363d;
    --accent:#58a6ff;
    --text:#f0f6fc;
    --secondary:#8b949e;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Inter, sans-serif;
}

/* NAV */
nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;
    display:flex;
    gap:10px;
    padding:10px 14px;
    border-radius:999px;
    background:rgba(22,27,34,.75);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1);
}

nav a{
    color:white;
    text-decoration:none;
    padding:10px 16px;
    border-radius:999px;
    font-weight:600;
}

nav a:hover{ background:var(--accent); }

.contact-btn{
    position:fixed;
    top:20px;
    right:20px;
    z-index:1000;
    padding:10px 18px;
    border-radius:12px;
    background:var(--accent);
    color:white;
    text-decoration:none;
    font-weight:700;
}

/* HERO */
.hero{
    min-height:65vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero h1{
    font-family:'Press Start 2P', cursive;
    font-size:2.4rem;
}

.hero p{
    margin-top:15px;
    color:var(--secondary);
}

/* SECTION TITLE */
.section-title{
    font-family:'Press Start 2P', cursive;
    font-size:1.6rem;
    text-align:center;
    margin-bottom:50px;
}

section{
    padding:100px 8%;
}

/* GRID */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill, 420px);
    justify-content:center;
    gap:30px;
}

/* CARD */
.card{
    width:420px;
    height:500px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    transition:.25s;
}

.card:hover{
    transform:scale(1.03);
    border-color:var(--accent);
}

.card img{
    width:100%;
    height:320px;
    object-fit:cover;
}

.card-content{
    padding:16px;
    text-align:center;
}

.card-content h3{
    font-family:'Press Start 2P', cursive;
    font-size:0.8rem;
}

.card-content p{
    margin-top:8px;
    color:var(--secondary);
}

/* MODAL */
.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:2000;
    flex-direction:column;
}

.modal.show{ display:flex; }

.modal img{
    max-width:90%;
    max-height:80%;
    border-radius:12px;
    border:2px solid var(--accent);
}

/* NAV BUTTONS */
.controls{
    margin-top:15px;
    display:flex;
    gap:20px;
}

.controls button{
    padding:10px 16px;
    border:none;
    background:var(--accent);
    color:white;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
}

/* CLOSE */
.close{
    position:absolute;
    top:20px;
    right:30px;
    font-size:30px;
    cursor:pointer;
    color:white;
}
</style>
</head>

<body>

<nav>
    <a href="#configs">Configs</a>
    <a href="#graphics">Designs</a>
</nav>

<a class="contact-btn" href="https://discord.com/users/YOUR_ID" target="_blank">
Contact Me
</a>

<div class="hero">
    <h1>MINECRAFT PORTFOLIO</h1>
    <p>Configs & Graphic Design Gallery</p>
</div>

<section id="configs">
<h2 class="section-title">CONFIGURATIONS</h2>
<div class="gallery" id="configsGallery"></div>
</section>

<section id="graphics">
<h2 class="section-title">GRAPHIC DESIGN</h2>
<div class="gallery" id="graphicsGallery"></div>
</section>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="close" onclick="closeModal()">×</div>
    <img id="modalImg">
    <div class="controls">
        <button onclick="prevImg()">Prev</button>
        <button onclick="nextImg()">Next</button>
    </div>
</div>

<script>
const configs = [
{
    title:"Config 1",
    desc:"PvP optimized setup",
    images:[
        "https://github.com/Ziurkiusss/ziurkiusss.github.io/blob/main/photos/configs/config2.png?raw=true",
        "https://github.com/Ziurkiusss/ziurkiusss.github.io/blob/main/photos/configs/config1.png?raw=true",
        "img3.png"
    ]
},
{
    title:"Config 2",
    desc:"FPS boost config",
    images:[
        "img4.png",
        "img5.png"
    ]
}
];

const graphics = [
{
    title:"Design 1",
    desc:"Thumbnail pack",
    images:[
        "img6.png",
        "img7.png"
    ]
}
];

let currentImages = [];
let currentIndex = 0;

function render(list, id){
    const container = document.getElementById(id);

    list.forEach((item, i) => {
        container.innerHTML += `
        <div class="card" onclick="openGallery('${id}', ${i})">
            <img src="${item.images[0]}">
            <div class="card-content">
                <h3>${item.title}</h3>
                <p>${item.desc}</p>
            </div>
        </div>
        `;
    });
}

function openGallery(type, index){
    const data = type === "configsGallery" ? configs : graphics;

    currentImages = data[index].images;
    currentIndex = 0;

    document.getElementById("modalImg").src = currentImages[0];
    document.getElementById("modal").classList.add("show");
}

function nextImg(){
    currentIndex = (currentIndex + 1) % currentImages.length;
    document.getElementById("modalImg").src = currentImages[currentIndex];
}

function prevImg(){
    currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
    document.getElementById("modalImg").src = currentImages[currentIndex];
}

function closeModal(){
    document.getElementById("modal").classList.remove("show");
}

render(configs, "configsGallery");
render(graphics, "graphicsGallery");
</script>

</body>
</html>
